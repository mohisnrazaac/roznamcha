[program:roznamcha-ssr]
process_name=%(program_name)s
directory=/var/www/roznamcha
command=/usr/bin/node bootstrap/ssr/ssr.js
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/roznamcha-ssr.log
stderr_logfile=/var/log/supervisor/roznamcha-ssr-error.log
environment=NODE_ENV="production"
